<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Visual (Blue) Gradient -->
    <linearGradient id="visGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Auditory (Green) Gradient -->
    <linearGradient id="audGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Kinesthetic (Amber) Gradient -->
    <linearGradient id="kinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />

  <!-- VAK 3 Neural Connection Arcs -->
  <path d="M 17 48 Q 32 38 47 48" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" />

  <!-- Academic Graduation Cap -->
  <!-- Cap Rhombus (Top) -->
  <polygon points="32,14 54,23 32,32 10,23" fill="#FFFFFF" />
  <polygon points="32,15 52,23 32,31 12,23" fill="url(#visGrad)" opacity="0.9" />

  <!-- Cap Skull Base -->
  <path d="M 18,26.5 L 18,34 Q 32,41 46,34 L 46,26.5" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Tassel / Ribbon -->
  <path d="M 46,24.5 C 49,27 51,32 50,36" fill="none" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="50" cy="37" r="2" fill="#FBBF24" />

  <!-- 3 Perception Channel Nodes (V - A - K) -->
  <!-- Visual (Blue) Node - Left -->
  <circle cx="16" cy="48" r="5" fill="url(#visGrad)" />
  <circle cx="16" cy="48" r="2" fill="#FFFFFF" />

  <!-- Auditory (Green) Node - Center -->
  <circle cx="32" cy="51" r="5.5" fill="url(#audGrad)" />
  <circle cx="32" cy="51" r="2.2" fill="#FFFFFF" />

  <!-- Kinesthetic (Amber) Node - Right -->
  <circle cx="48" cy="48" r="5" fill="url(#kinGrad)" />
  <circle cx="48" cy="48" r="2" fill="#FFFFFF" />
</svg>
